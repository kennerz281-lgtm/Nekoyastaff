<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nekoya — Central Staff</title><meta name="description" content="Central de recrutamento da equipe Nekoya."><style>
:root{
    --pink:#ff6fae;
    --pink2:#ff4e93;
    --blue:#54a9ff;
    --blue2:#2f7fe0;
    --yellow:#ffd95c;
    --cream:#fff8e8;
    --white:#fff;
    --black:#17151a;
    --muted:#6c6670;
    --green:#6ed59a;
    --shadow:8px 8px 0 var(--black);
    --shadow-small:5px 5px 0 var(--black);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--black);
    background:
        radial-gradient(circle at 15% 10%,rgba(255,255,255,.8) 0 3px,transparent 4px),
        radial-gradient(circle at 80% 30%,rgba(0,0,0,.04) 0 2px,transparent 3px),
        linear-gradient(135deg,#fff5df 0%,#fff9ef 50%,#eef7ff 100%);
    background-size:34px 34px,26px 26px,100% 100%;
    min-height:100vh;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:100;
    padding:16px 20px;
    border-bottom:4px solid var(--black);
    background:rgba(255,248,232,.94);
    backdrop-filter:blur(12px);
}

.nav{
    max-width:1180px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-logo{
    width:52px;
    height:52px;
    border:4px solid var(--black);
    border-radius:18px;
    overflow:hidden;
    background:var(--pink);
    box-shadow:var(--shadow-small);
    flex:none;
}

.brand-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.brand-text{
    display:flex;
    flex-direction:column;
    line-height:1;
}

.brand-title{
    font-size:23px;
    font-weight:1000;
    letter-spacing:-1px;
}

.brand-sub{
    margin-top:6px;
    color:var(--muted);
    font-size:11px;
    font-weight:800;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:24px;
}

.nav-link-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:38px;
    gap:3px;
}

.nav-link{
    font-size:13px;
    line-height:1;
    font-weight:1000;
    text-transform:uppercase;
    letter-spacing:.8px;
    white-space:nowrap;
}

.nav-credit{
    font-size:9px;
    line-height:1;
    font-weight:900;
    color:var(--pink2);
    white-space:nowrap;
}

.header-staff{
    padding:11px 17px;
    border:3px solid var(--black);
    border-radius:15px;
    background:var(--blue);
    box-shadow:var(--shadow-small);
    font-weight:1000;
    font-size:12px;
    white-space:nowrap;
}

/* ================= HERO ================= */

.hero{
    max-width:1180px;
    margin:auto;
    padding:58px 20px 34px;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:28px;
    align-items:stretch;
}

.hero-copy{
    position:relative;
    padding:42px;
    border:4px solid var(--black);
    border-radius:32px;
    background:var(--cream);
    box-shadow:var(--shadow);
    overflow:hidden;
}

.hero-copy::before{
    content:"";
    position:absolute;
    width:130px;
    height:130px;
    border-radius:50%;
    background:var(--yellow);
    right:-45px;
    top:-45px;
    border:4px solid var(--black);
}

.hero-kicker{
    display:inline-flex;
    padding:9px 14px;
    border:3px solid var(--black);
    border-radius:999px;
    background:var(--pink);
    box-shadow:4px 4px 0 var(--black);
    font-weight:1000;
    font-size:11px;
    letter-spacing:.7px;
    text-transform:uppercase;
}

.hero h1{
    position:relative;
    margin-top:26px;
    max-width:700px;
    font-size:clamp(42px,7vw,78px);
    line-height:.92;
    letter-spacing:-4px;
    font-weight:1000;
}

.hero h1 span{
    color:var(--blue2);
    text-shadow:4px 4px 0 var(--black);
}

.hero-description{
    margin-top:24px;
    max-width:620px;
    color:#48434b;
    font-size:17px;
    line-height:1.7;
    font-weight:700;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-top:28px;
}

.btn{
    border:4px solid var(--black);
    border-radius:16px;
    padding:14px 19px;
    font-weight:1000;
    box-shadow:var(--shadow-small);
    transition:.16s ease;
}

.btn:hover{
    transform:translate(3px,3px);
    box-shadow:2px 2px 0 var(--black);
}

.btn-primary{
    background:var(--pink);
}

.btn-secondary{
    background:var(--white);
}

.btn-blue{
    background:var(--blue);
}

.hero-note{
    margin-top:22px;
    font-size:11px;
    font-weight:900;
    color:var(--muted);
}

.hero-image-card{
    position:relative;
    min-height:470px;
    border:4px solid var(--black);
    border-radius:32px;
    overflow:hidden;
    background:var(--blue);
    box-shadow:var(--shadow);
}

.hero-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.hero-fallback{
    position:absolute;
    inset:0;
    display:none;
    place-items:center;
    text-align:center;
    padding:30px;
    background:linear-gradient(135deg,rgba(255,111,174,.9),rgba(84,169,255,.9));
}

.hero-fallback strong{
    font-size:28px;
    font-weight:1000;
}

.sticker{
    position:absolute;
    z-index:2;
    border:4px solid var(--black);
    background:var(--yellow);
    box-shadow:var(--shadow-small);
    border-radius:18px;
    padding:12px 15px;
    font-size:12px;
    font-weight:1000;
}

.sticker.one{
    top:22px;
    left:22px;
    transform:rotate(-7deg);
}

.sticker.two{
    bottom:22px;
    right:22px;
    background:var(--pink);
    transform:rotate(6deg);
}

/* ================= SECTIONS ================= */

.section{
    max-width:1180px;
    margin:auto;
    padding:32px 20px;
}

.section-heading{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:20px;
}

.section-kicker{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.3px;
    font-weight:1000;
    color:var(--pink2);
}

.section-title{
    margin-top:5px;
    font-size:34px;
    line-height:1;
    letter-spacing:-1.5px;
    font-weight:1000;
}

.section-description{
    max-width:570px;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
    font-weight:700;
}

/* ================= TEMA ================= */

.theme-card{
    display:grid;
    grid-template-columns:.95fr 1.05fr;
    border:4px solid var(--black);
    border-radius:28px;
    overflow:hidden;
    background:var(--white);
    box-shadow:var(--shadow);
}

.theme-image-box{
    min-height:360px;
    background:#d9ecff;
    overflow:hidden;
}

.theme-image{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.theme-content{
    padding:34px;
    background:var(--cream);
}

.theme-label{
    display:inline-block;
    padding:8px 12px;
    border:3px solid var(--black);
    border-radius:999px;
    background:var(--yellow);
    font-size:10px;
    font-weight:1000;
    text-transform:uppercase;
}

.theme-content h3{
    margin-top:18px;
    font-size:39px;
    line-height:1;
    letter-spacing:-2px;
    font-weight:1000;
}

.theme-content p{
    margin-top:18px;
    color:#57515a;
    line-height:1.7;
    font-size:14px;
    font-weight:700;
}

.theme-tags{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:22px;
}

.theme-tag{
    padding:9px 12px;
    border:3px solid var(--black);
    border-radius:12px;
    background:var(--white);
    font-size:10px;
    font-weight:1000;
    box-shadow:3px 3px 0 var(--black);
}

/* ================= DIRETRIZES ================= */

.rules-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.rule-card{
    position:relative;
    padding:27px 24px 25px;
    border:4px solid var(--black);
    border-radius:24px;
    box-shadow:var(--shadow-small);
    overflow:hidden;
}

.rule-card:nth-child(1){
    background:#fff1f7;
}

.rule-card:nth-child(2){
    background:#eef7ff;
}

.rule-card:nth-child(3){
    background:#fff9df;
}

.rule-decoration{
    width:54px;
    height:18px;
    border:3px solid var(--black);
    border-radius:999px;
    margin-bottom:18px;
    box-shadow:3px 3px 0 var(--black);
}

.rule-card:nth-child(1) .rule-decoration{
    background:var(--pink);
}

.rule-card:nth-child(2) .rule-decoration{
    background:var(--blue);
}

.rule-card:nth-child(3) .rule-decoration{
    background:var(--yellow);
}

.rule-card h3{
    font-size:20px;
    font-weight:1000;
    letter-spacing:-.5px;
}

.rule-card p{
    margin-top:10px;
    color:var(--muted);
    line-height:1.65;
    font-size:13px;
    font-weight:700;
}

/* ================= RECRUTAMENTO ================= */

.recruitment{
    display:grid;
    grid-template-columns:260px 1fr;
    gap:22px;
    align-items:start;
}

.recruitment-side{
    position:sticky;
    top:95px;
}

.side-card{
    padding:22px;
    border:4px solid var(--black);
    border-radius:22px;
    background:var(--blue);
    box-shadow:var(--shadow-small);
}

.side-card h3{
    font-size:21px;
    font-weight:1000;
}

.side-card p{
    margin-top:11px;
    color:#15385d;
    font-size:12px;
    line-height:1.6;
    font-weight:800;
}

.side-points{
    margin-top:18px;
    display:grid;
    gap:9px;
}

.side-point{
    padding:10px 12px;
    background:rgba(255,255,255,.72);
    border:3px solid var(--black);
    border-radius:13px;
    font-size:10px;
    font-weight:1000;
}

.form-card{
    border:4px solid var(--black);
    border-radius:26px;
    background:var(--white);
    box-shadow:var(--shadow);
    overflow:hidden;
}

.form-top{
    padding:23px 25px;
    border-bottom:4px solid var(--black);
    background:var(--cream);
}

.progress-wrap{
    display:flex;
    align-items:center;
    gap:14px;
}

.progress-track{
    flex:1;
    height:13px;
    border:3px solid var(--black);
    border-radius:999px;
    background:#e8e3dc;
    overflow:hidden;
}

.progress-bar{
    width:33.33%;
    height:100%;
    background:var(--pink);
    transition:.25s ease;
}

.step-count{
    min-width:58px;
    text-align:right;
    font-size:11px;
    font-weight:1000;
}

.form-body{
    padding:26px;
}

.form-step{
    display:none;
}

.form-step.active{
    display:block;
}

.form-step h3{
    font-size:25px;
    font-weight:1000;
    letter-spacing:-1px;
}

.form-step-subtitle{
    margin-top:7px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

.fields{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    margin-top:22px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:11px;
    font-weight:1000;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:3px solid var(--black);
    border-radius:13px;
    padding:13px 14px;
    outline:none;
    background:#fffdf7;
    color:var(--black);
    font-size:13px;
    font-weight:700;
    transition:.15s ease;
}

.field textarea{
    resize:vertical;
    min-height:120px;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    transform:translateY(-1px);
    box-shadow:4px 4px 0 var(--blue);
}

.age-input{
    max-width:150px;
}

.form-actions{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:24px;
}

/* ================= CONFIRMAÇÃO ================= */

.success-screen{
    display:none;
    text-align:center;
    padding:42px 22px 35px;
}

.success-screen.show{
    display:block;
    animation:successIn .35s ease;
}

@keyframes successIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.success-icon{
    width:82px;
    height:82px;
    margin:0 auto;
    display:grid;
    place-items:center;
    border:4px solid var(--black);
    border-radius:26px;
    background:var(--green);
    box-shadow:var(--shadow-small);
    font-size:36px;
    font-weight:1000;
}

.success-screen h3{
    margin-top:24px;
    font-size:31px;
    line-height:1;
    font-weight:1000;
    letter-spacing:-1.2px;
}

.success-screen h3 span{
    color:var(--pink2);
}

.success-screen p{
    max-width:540px;
    margin:15px auto 0;
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
    font-weight:700;
}

.success-status{
    display:inline-block;
    margin-top:21px;
    padding:10px 15px;
    border:3px solid var(--black);
    border-radius:999px;
    background:var(--yellow);
    font-size:10px;
    font-weight:1000;
    box-shadow:3px 3px 0 var(--black);
}

/* ================= STAFF ================= */

.staff-section{
    padding-top:44px;
}

.staff-login{
    max-width:560px;
    margin:auto;
    padding:26px;
    border:4px solid var(--black);
    border-radius:25px;
    background:var(--cream);
    box-shadow:var(--shadow);
}

.login-title{
    font-size:28px;
    font-weight:1000;
}

.login-subtitle{
    margin-top:7px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    font-weight:700;
}

.login-row{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.login-row input{
    flex:1;
    border:3px solid var(--black);
    border-radius:13px;
    padding:13px 14px;
    outline:none;
    background:white;
    font-weight:800;
}

.login-error{
    display:none;
    margin-top:11px;
    color:#c03636;
    font-size:11px;
    font-weight:1000;
}

.staff-panel{
    display:none;
    margin-top:24px;
}

.staff-panel.show{
    display:block;
}

.metrics{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.metric{
    position:relative;
    padding:23px;
    border:4px solid var(--black);
    border-radius:22px;
    box-shadow:var(--shadow-small);
    overflow:hidden;
}

.metric:nth-child(1){
    background:var(--pink);
}

.metric:nth-child(2){
    background:var(--blue);
}

.metric:nth-child(3){
    background:var(--yellow);
}

.metric::after{
    content:"";
    position:absolute;
    width:80px;
    height:80px;
    border-radius:50%;
    border:4px solid var(--black);
    right:-22px;
    top:-22px;
    background:rgba(255,255,255,.23);
}

.metric-label{
    position:relative;
    z-index:2;
    font-size:10px;
    text-transform:uppercase;
    font-weight:1000;
    letter-spacing:.8px;
}

.metric-number{
    position:relative;
    z-index:2;
    margin-top:8px;
    font-size:35px;
    line-height:1;
    font-weight:1000;
}

.metric-sub{
    position:relative;
    z-index:2;
    margin-top:8px;
    font-size:10px;
    font-weight:900;
}

.staff-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    margin-top:22px;
    padding:18px 20px;
    border:4px solid var(--black);
    border-radius:19px;
    background:var(--white);
}

.staff-toolbar-title{
    font-size:18px;
    font-weight:1000;
}

.staff-toolbar-count{
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
}

.applications-list{
    margin-top:18px;
    display:grid;
    gap:14px;
}

.application-card{
    padding:21px;
    border:4px solid var(--black);
    border-radius:20px;
    background:var(--white);
    box-shadow:var(--shadow-small);
}

.application-head{
    display:flex;
    justify-content:space-between;
    gap:14px;
    align-items:start;
}

.application-name{
    font-size:20px;
    font-weight:1000;
}

.application-meta{
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
    font-weight:800;
}

.status-badge{
    padding:8px 11px;
    border:3px solid var(--black);
    border-radius:999px;
    background:#dff9e9;
    font-size:9px;
    font-weight:1000;
    text-transform:uppercase;
}

.application-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
    margin-top:18px;
}

.application-item{
    padding:13px;
    border:3px solid var(--black);
    border-radius:14px;
    background:#fffaf0;
}

.application-item.full{
    grid-column:1/-1;
}

.application-item-label{
    font-size:9px;
    text-transform:uppercase;
    font-weight:1000;
    color:var(--pink2);
}

.application-item-value{
    margin-top:5px;
    white-space:pre-wrap;
    font-size:12px;
    line-height:1.5;
    font-weight:700;
}

.empty-state{
    padding:35px;
    text-align:center;
    border:4px dashed var(--black);
    border-radius:20px;
    background:var(--cream);
}

.empty-state strong{
    display:block;
    font-size:20px;
    font-weight:1000;
}

.empty-state p{
    margin-top:7px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

.clear-button{
    border:3px solid var(--black);
    border-radius:12px;
    padding:10px 13px;
    background:#fff;
    font-size:10px;
    font-weight:1000;
}

/* ================= FOOTER ================= */

.footer{
    margin-top:55px;
    border-top:4px solid var(--black);
    background:var(--black);
    color:white;
}

.footer-inner{
    max-width:1180px;
    margin:auto;
    padding:28px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.footer-brand{
    font-size:18px;
    font-weight:1000;
}

.footer-text{
    margin-top:5px;
    color:#bbb6bd;
    font-size:10px;
    font-weight:700;
}

.footer-right{
    text-align:right;
    font-size:10px;
    color:#d7d2d8;
    font-weight:800;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .hero-grid,
    .theme-card,
    .recruitment{
        grid-template-columns:1fr;
    }

    .recruitment-side{
        position:static;
    }

    .rules-grid{
        grid-template-columns:1fr;
    }

    .metrics{
        grid-template-columns:1fr;
    }

    .theme-image-box{
        min-height:300px;
    }
}

@media(max-width:700px){

    .header{
        padding:12px 14px;
    }

    .nav-links{
        display:none;
    }

    .hero{
        padding:35px 14px 25px;
    }

    .hero-copy{
        padding:27px;
    }

    .hero h1{
        font-size:53px;
        letter-spacing:-3px;
    }

    .hero-description{
        font-size:14px;
    }

    .hero-image-card{
        min-height:350px;
    }

    .section{
        padding:28px 14px;
    }

    .section-title{
        font-size:29px;
    }

    .fields{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .form-body{
        padding:20px;
    }

    .login-row{
        flex-direction:column;
    }

    .staff-toolbar,
    .footer-inner{
        flex-direction:column;
